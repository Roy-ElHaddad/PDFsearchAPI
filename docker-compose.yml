services:
  # Only the api service is long-running, so it's the only one modeled as
  # a Compose service. Ingestion is a one-shot job whose input folder
  # varies per invocation (see the Makefile's `ingest` target) — that
  # doesn't fit Compose's static, pre-declared volume mounts well, so it
  # runs via a plain `docker run` instead, mounting whatever folder the
  # caller passes in.
  api:
    build: .
    image: pdfsearch-api:latest
    ports:
      # ${API_PORT:-8000} lets `make up API_PORT=9000` actually take
      # effect instead of always binding 8000 regardless of the flag.
      - "${API_PORT:-8000}:8000"
    volumes:
      # The API only ever reads the built index, never the source PDFs.
      - ./data/index:/app/data/index
      - model_cache:/root/.cache

volumes:
  # Caches downloaded embedding model weights across ingest/api runs so
  # they aren't re-fetched from the internet every time a container starts.
  # Named explicitly (rather than left to Compose's project-prefixed
  # default) so `make ingest`, which runs a plain `docker run` outside
  # Compose, shares this exact volume instead of creating its own.
  model_cache:
    name: pdfsearch_model_cache
